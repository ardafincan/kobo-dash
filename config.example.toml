# Kobo Dashboard configuration — template.
# Copy to config.toml and fill in real values. config.toml is gitignored.

[calendar]
# Google Calendar PRIVATE iCal address (Calendar settings -> "Secret address
# in iCal format"). This is NOT the API. There is no OAuth and no token to
# expire. TREAT THIS URL AS A PASSWORD.
ics_url = "https://calendar.google.com/calendar/ical/EXAMPLE/private-EXAMPLE/basic.ics"

[location]
latitude = 41.0082
longitude = 28.9784

# IANA timezone string used for weather, calendar day filtering, and timestamps.
timezone = "Europe/Istanbul"

[display]
# Output rotation. FBInk sees a portrait framebuffer; we draw landscape and
# rotate on write. 90 or 270 depending on which side you want the USB-C port.
# This is verified on-device in Phase 2, step 4.
rotate = 90

# The display rotation. The DEVICE reads this from manifest.json, so changing
# it here (then re-rendering) needs no redeploy to the reader. Slots may repeat.
# Each slot is either a bare name (uses default_minutes) or gives its own
# duration: { screen = "day.png", minutes = 15 }.
default_minutes = 5
sequence = [
  { screen = "day.png",   minutes = 15 },
  { screen = "news.png",  minutes = 3 },
  { screen = "day.png",   minutes = 15 },
  { screen = "quote.png", minutes = 3 },
]

[server]
# LAN IP of the Mac Mini that serves out/ and runs the render timer.
host = "192.168.1.2"
port = 8080

[quote]
# The quote screen defaults to the local quotes.json (deterministic by date).
# Optionally ask Google Gemini once per day for a real, attributed quote. The
# result is cached to quote_cache.json (one API call per day); on ANY failure it
# falls back to quotes.json, so the screen never blanks.
use_gemini = false
# Get a key from https://aistudio.google.com/apikey . Treat it as a password.
gemini_api_key = ""
gemini_model = "gemini-2.5-flash"
# Optional. Leave unset to use the built-in prompt. {date} is filled in.
# prompt = "Give me one real, accurately attributed quotation ... for {date}."

[football]
# Show a team's next fixture on the day screen (via TheSportsDB, free key).
# Find team_id at: https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=NAME
enabled = false
team_id = "133794"      # Beşiktaş
team_name = "Beşiktaş"  # used to resolve home/away
api_key = "3"           # TheSportsDB free public key
